{
    "device.node_id": "canary-01",
    "ip.ignorelist": [],
    "logtype.ignorelist": [1002],

    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready",
    "ftp.log_auth_attempt_initiated": false,

    "ssh.enabled": true,
    "ssh.port": 22,
    "ssh.version": "SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5",

    "telnet.enabled": true,
    "telnet.port": 23,
    "telnet.banner": "",
    "telnet.max_connections": 64,
    "telnet.timeout": 120,
    "telnet.honeycreds": [],
    "telnet.log_tcp_connection": false,

    "http.enabled": true,
    "http.port": 80,
    "http.banner": "Apache/2.4.41 (Ubuntu)",
    "http.skin": "nasLogin",
    "http.log_unimplemented_method_requests": false,
    "http.log_redirect_request": false,
    "https.enabled": false,

    "mysql.enabled": true,
    "mysql.port": 3306,
    "mysql.banner": "5.7.42-0ubuntu0.18.04.1",
    "mysql.log_connection_made": false,

    "rdp.enabled": true,
    "rdp.port": 3389,

    "vnc.enabled": true,
    "vnc.port": 5900,

    "redis.enabled": true,
    "redis.port": 6379,

    "git.enabled": true,
    "git.port": 9418,
    "git.max_connections": 32,
    "git.timeout": 10,

    "httpproxy.enabled": false,
    "llmnr.enabled": false,
    "mssql.enabled": false,
    "ntp.enabled": false,
    "sip.enabled": false,
    "smb.enabled": false,
    "snmp.enabled": false,
    "tcpbanner.enabled": false,
    "tftp.enabled": false,
    "portscan.enabled": false,

    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": { "format": "%(message)s" }
            },
            "handlers": {
                "console": {
                    "class": "logging.StreamHandler",
                    "stream": "ext://sys.stdout"
                },
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary/opencanary.log"
                }
            }
        }
    }
}
